
name: Build Lesspecad APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Find Android SDK and accept licenses
        shell: bash
        run: |
          set -e
          echo "ANDROID_HOME=$ANDROID_HOME"

          SDKMANAGER="$(find "$ANDROID_HOME" \
            -type f -name sdkmanager -perm /111 \
            -print -quit)"

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager tidak ditemukan"
            find "$ANDROID_HOME/cmdline-tools" \
              -maxdepth 4 -type f -print 2>/dev/null || true
            exit 1
          fi

          echo "Menggunakan: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses

      - name: Build debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Lesspecad-debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
