
name: Build Lesspecad APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate Android SDK
        shell: bash
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME}"
          echo "ANDROID_SDK_ROOT=${ANDROID_HOME}"

          SDKMANAGER="$(find "$ANDROID_HOME" \
            -type f -name sdkmanager -perm /111 \
            -print -quit 2>/dev/null || true)"

          if [ -n "$SDKMANAGER" ]; then
            echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
            echo "SDKMANAGER ditemukan: $SDKMANAGER"
          else
            echo "SDKMANAGER tidak ditemukan"
          fi

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          if [ -n "${SDKMANAGER:-}" ] && [ -x "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses || true
          else
            echo "Lisensi tidak diproses; melanjutkan ke build"
          fi

      - name: Build debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Lesspecad-debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
